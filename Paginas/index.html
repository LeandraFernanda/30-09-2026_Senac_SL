<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="html.png" type="image/x-icon">
    <title>Estruturação e estilização em HTML</title>
</head>
<body>
    <div style="position: fixed; top: 0; left: 0; width: 100%; background-color: #333; color: white; padding: 15px;">
    <nav>
        <a href="#home" style="color: rgb(156, 211, 154);">Home</a> |
        <a href="#sobre" style="color: rgb(115, 199, 113);">Sobre</a> |
        <a href="#contato" style="color: rgb(100, 182, 138);">Contato</a>
    </nav>
</div>
<hr>
<br>
<h2 style="color: rgb(13, 84, 24); text-align: center; ;">Formulário de Contato</h2>
<form action="#" method="post">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required>
    <br><br>

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" required>
    <br><br>

    <label for="mensagem">Mensagem:</label>
    <textarea id="mensagem" name="mensagem"></textarea>
    <br><br>

    <input type="submit" value="Enviar">
</form>
<footer>
    <div></div>
</footer>
</body>
</html>
