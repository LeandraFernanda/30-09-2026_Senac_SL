<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Testando Responsividade</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            Meu Site
        </div>

        <input type="checkbox" id="menu-toggle">

        <label for="menu-toggle" class="menu-button">
            ☰
        </label>

        <nav class="nav">
            <a href="#">Início</a>
            <a href="#">Sobre</a>
            <a href="#">Serviços</a>
            <a href="#">Contato</a>
        </nav>

    </header>

    <main>

        <section class="hero">

            <h1>Minha Página Responsiva</h1>

            <p>
                Redimensione a janela do navegador
                e observe as mudanças.
            </p>

        </section>

        <section class="cards-section">

            <h2>Meus Cards</h2>

            <div class="cards">

                <div class="card">
                    <h3>Card 1</h3>
                    <p>Primeiro exemplo.</p>
                </div>

                <div class="card">
                    <h3>Card 2</h3>
                    <p>Segundo exemplo.</p>
                </div>

                <div class="card">
                    <h3>Card 3</h3>
                    <p>Terceiro exemplo.</p>
                </div>

            </div>

        </section>

    </main>

</body>

</html>
